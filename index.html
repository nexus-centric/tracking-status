<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="theme-color" content="#f5f7fa" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>%APP_NAME%</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f5f7fa; color: #0d1321; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .skel-boot { max-width: 1080px; margin: 0 auto; padding: 2rem 1.15rem; }
      .skel-boot .s { background: #eaeef4; border-radius: 8px; }
      .skel-boot .t { width: min(16rem, 70%); height: 1.8rem; margin-bottom: 1.5rem; }
      .skel-boot .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 1rem; }
      .skel-boot .c { height: 14rem; border-radius: 12px; background: #fff; border: 1px solid #e3e7ee; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="skel-boot" aria-hidden="true"><div class="s t"></div><div class="row"><div class="c"></div><div class="c"></div></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
